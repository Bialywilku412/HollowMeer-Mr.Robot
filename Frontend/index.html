<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Retro games</title>
</head>
<body>
    <header>
        <nav class="navbar navbar--active">
            <button class="dropdown-btn" onclick="showMenu()">Menu</button>
            <ul class="navbar-list" id="myDropdown">
                <li ><a href="login.html"> Beastiary</a></li>
                <li ><a href="register.html"> Locations</a></li>
                <li ><a href="register.html"> Armoury</a></li>
                <li ><a href="login.html"> Over us</a></li>
                <li ><a href="register.html"> Members</a></li>
            </ul>
        </nav>
        <nav class="profile">
            <button class="dropdown-btn" onclick="showProfile()">Profile</button>
            <ul class="profile-list" id="profileDropdown">
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>
    <script>
/* When the user clicks on the button, 
toggle between hiding and showing the dropdown content */
function showMenu() {
  document.getElementById("myDropdown").classList.toggle("show");
}
function showProfile() {
  document.getElementById("profileDropdown").classList.toggle("show");
}

// Close the dropdown if the user clicks outside of it
window.onclick = function(e) {
  if (!e.target.matches('.dropdown-btn')) {
  var myDropdown = document.getElementById("myDropdown");
    if (myDropdown.classList.contains('show')) {
      myDropdown.classList.remove('show');
    }
  }
}
</script>
    
    
</body>
</html>
